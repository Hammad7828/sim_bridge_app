name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Force manual signing with no team
        run: |
          cd ios
          PBXPROJ="Runner.xcodeproj/project.pbxproj"

          echo "----- BEFORE PATCH -----"
          grep -n "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY" "$PBXPROJ" || echo "No existing signing lines found (this is OK)"

          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ" || true
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBXPROJ" || true

          echo "----- AFTER PATCH -----"
          grep -n "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY" "$PBXPROJ" || echo "Still no signing lines found"

      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign

      - name: Verify build output exists
        run: |
          ls -la build/ios/iphoneos/
          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r sim_bridge_app.ipa Payload
          ls -la sim_bridge_app.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-bridge-ios-app
          path: sim_bridge_app.ipa