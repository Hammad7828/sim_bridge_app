name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Flutter iOS build config (no full build)
        run: flutter build ios --release --no-codesign --config-only

      - name: Build via xcodebuild directly (bypasses Flutter's team check)
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate built app
        run: |
          find ios/build -name "Runner.app" -maxdepth 6

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "Runner.app" -maxdepth 6 | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r sim_bridge_app.ipa Payload
          ls -la sim_bridge_app.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-bridge-ios-app
          path: sim_bridge_app.ipa